name: Bootstrap XS3 from verified V4.3 template

on:
  push:
    paths:
      - '.github/workflows/bootstrap-xs3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-xs3
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new XS3 repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Skip if a book is already initialized
        id: check
        run: |
          if [ -f book/state.json ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import exact V4.3 source, never previous book state
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/1464356758/XS2.git /tmp/xs2-template
          cd /tmp/xs2-template
          git checkout --quiet 872ba91d0ca74d1515ed081add39b55daca51043
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/xs2-template')
          m=json.loads((root/'INIT_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['template_version']=='4.3-quality'
          assert m['contains_novel_data'] is False
          for name,expected in m['files'].items():
              if name in ('project_config.json','online/index.json'):
                  continue  # per-book files are replaced during bootstrap
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected, name
          print('Verified template files:',len(m['files']))
          PY
          rsync -a             --exclude='.git'             --exclude='book/state.json'             --exclude='book/workflow.json'             --exclude='online/index.json' \
            --exclude='.github/workflows/validate.yml'             /tmp/xs2-template/ ./
          test ! -f book/state.json
          test ! -f book/workflow.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('project_config.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          j['project_name']='新小说项目'
          j['authority']={'mode':'github','repository_url':'','branch':'main'}
          j['writing']['platform']=None
          j['writing']['genre']=None
          j['storage']={'mode':'plain_files','requires_reader_key':False}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tools/online_state.py bootstrap --repo https://github.com/1464356758/XS3 --branch main --title '未命名小说'
          python3 tools/online_state.py validate-index
      - name: Commit full workspace
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Initialize XS3 from verified V4.3 writing template"
          git push origin HEAD:main
